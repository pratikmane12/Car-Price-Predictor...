<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Car Price Predictor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
</head>
<body class="bg-dark">

<div class="container">
    <div class="row">
        <div class="card mt-50" style="width: 100%">
            <div class="card-header" style="text-align: center">
                <h1>Welcome to Car Price Predictor</h1>
            </div>
            <div class="card-body">
                <div class="col-12" style="text-align: center">
                    <h5>This app predicts the price of a car you want to sell. Try filling the details below:</h5>
                </div>
                <br>
                <form id="predict-form" method="post" accept-charset="utf-8" name="Modelform">

                    <div class="col-md-10 form-group" style="text-align: center">
                        <label><b>Select the company:</b></label><br>
                        <select class="form-control" id="company" name="company" required>
                            <option value="" selected disabled>Select Company</option>
                            {% for company in companies %}
                            <option value="{{ company }}">{{ company }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-10 form-group" style="text-align: center">
                        <label><b>Select the model:</b></label><br>
                        <select class="form-control" id="car_models" name="car_models" required>
                            <option value="" selected disabled>Select a company first</option>
                        </select>
                    </div>

                    <div class="col-md-10 form-group" style="text-align: center">
                        <label><b>Select Year of Purchase:</b></label><br>
                        <select class="form-control" id="year" name="year" required>
                            {% for year in years %}
                            <option value="{{ year }}">{{ year }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-10 form-group" style="text-align: center">
                        <label><b>Select the Fuel Type:</b></label><br>
                        <select class="form-control" id="fuel_type" name="fuel_type" required>
                            {% for fuel in fuel_types %}
                            <option value="{{ fuel }}">{{ fuel }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-10 form-group" style="text-align: center">
                        <label><b>Enter the number of kilometres the car has travelled:</b></label><br>
                        <input type="number" min="0" class="form-control" id="kilo_driven" name="kilo_driven"
                               placeholder="Enter the kilometres driven" required>
                    </div>

                    <div class="col-md-10 form-group" style="text-align: center">
                        <button type="submit" class="btn btn-primary form-control">Predict Price</button>
                    </div>
                </form>
                <br>
                <div class="row">
                    <div class="col-12" style="text-align: center">
                        <h4><span id="prediction"></span></h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Car model names from Flask, passed as JSON -->
<script id="car-models-data" type="application/json">{{ car_models_json | safe }}</script>

<script>
    const allModels = JSON.parse(document.getElementById("car-models-data").textContent);
    const companySelect = document.getElementById("company");
    const modelSelect = document.getElementById("car_models");
    const form = document.getElementById("predict-form");
    const output = document.getElementById("prediction");

    function addOption(select, value, text, disabled) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = text;
        if (disabled) {
            option.disabled = true;
            option.selected = true;
        }
        select.appendChild(option);
    }

    function loadCarModels() {
        const company = companySelect.value;
        modelSelect.innerHTML = "";

        if (!company) {
            addOption(modelSelect, "", "Select a company first", true);
            return;
        }

        const filtered = allModels.filter(function (m) {
            return m.toLowerCase().indexOf(company.toLowerCase()) === 0;
        });

        if (filtered.length === 0) {
            addOption(modelSelect, "", "No models found", true);
            return;
        }

        filtered.forEach(function (m) {
            addOption(modelSelect, m, m, false);
        });
    }

    companySelect.addEventListener("change", loadCarModels);
    loadCarModels();

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/predict", true);
        output.textContent = "Wait! Predicting Price.....";

        xhr.onreadystatechange = function () {
            if (xhr.readyState === XMLHttpRequest.DONE) {
                if (xhr.status === 200) {
                    output.textContent = "Prediction: ₹" + xhr.responseText;
                } else if (xhr.status === 400) {
                    output.textContent = xhr.responseText;
                } else {
                    output.textContent = "Something went wrong. Please try again.";
                }
            }
        };

        xhr.send(new FormData(form));
    });
</script>

<!-- jQuery, Popper, Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
        crossorigin="anonymous"></script>
</body>
</html>
